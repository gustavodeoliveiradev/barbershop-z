<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>BarberShop Z | Estilo & Tradição</title>
</head>
<body>
    <div class="noise"></div>

    <nav class="navbar">

            </label>

            <h1 class="logo">BARBER<span>SHOP Z</span></h1>

            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Sobre</a></li>

                <li><a href="#">Contato</a></li>
                <li><a href="#" class="btn-nav">Agendamento</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <span class="hero-subtitle">Desde 2026 • Excelência em Cortes</span>
            <h1>Estilo e Tradição para o <br><span>Homem Moderno</span></h1>
            <p>Onde a arte da barbearia clássica encontra a sofisticação contemporânea. Reserve seu momento de cuidado exclusivo.</p>
            <div class="hero-btns">
                <a href="#" class="btn-primary">Agendar Horário</a>
